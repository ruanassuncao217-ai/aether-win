[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Aether Clock
Author=Aether-Win
Version=1.0
License=MIT
Information=Relogio futurista com barra de segundos.

@Include=#@#Variables.inc

; ---------- Medidas ----------
[MeasureTime]
Measure=Time
Format=%H:%M

[MeasureSeconds]
Measure=Time
Format=%S
MinValue=0
MaxValue=59

[MeasureDate]
Measure=Time
Format=%A  //  %d.%m.%Y

; ---------- Meters ----------
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,420,190,16 | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorMain#,110
Shape2=Rectangle 0,0,4,190,2 | Fill Color #ColorMain# | StrokeWidth 0

[MeterTag]
Meter=String
X=26
Y=16
FontFace=#FontMain#
FontSize=9
FontColor=#ColorMain#
StringStyle=Bold
Text=A E T H E R   //   T I M E
AntiAlias=1

[MeterTime]
Meter=String
MeasureName=MeasureTime
X=24
Y=34
FontFace=#FontLight#
FontSize=60
FontColor=#ColorText#
StringEffect=Shadow
FontEffectColor=#ColorMain#,140
AntiAlias=1

[MeterDate]
Meter=String
MeasureName=MeasureDate
X=28
Y=125
FontFace=#FontMain#
FontSize=11
FontColor=#ColorDim#
StringCase=Upper
AntiAlias=1

[MeterSecondsTrack]
Meter=Shape
X=28
Y=160
Shape=Rectangle 0,0,364,3,1.5 | Fill Color #ColorMain#,40 | StrokeWidth 0

[MeterSeconds]
Meter=Bar
MeasureName=MeasureSeconds
X=28
Y=160
W=364
H=3
BarColor=#ColorMain#
BarOrientation=Horizontal
