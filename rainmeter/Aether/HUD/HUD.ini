[Rainmeter]
Update=1000
AccurateText=1
DynamicWindowSize=1

[Metadata]
Name=Aether HUD
Author=Aether-Win
Version=1.0
License=MIT
Information=HUD de sistema: CPU, RAM, disco C: e rede em aneis neon.

@Include=#@#Variables.inc

; ---------- Medidas ----------
[MeasureCPU]
Measure=CPU

[MeasureRAM]
Measure=PhysicalMemory

[MeasureDisk]
Measure=FreeDiskSpace
Drive=C:
InvertMeasure=1

[MeasureNetIn]
Measure=NetIn
Interface=Best

[MeasureNetOut]
Measure=NetOut
Interface=Best

[MeasureFull]
Measure=Calc
Formula=1
MinValue=0
MaxValue=1

; ---------- Estilos ----------
[StyleRingBg]
Meter=Roundline
MeasureName=MeasureFull
W=110
H=110
StartAngle=2.356
RotationAngle=4.712
LineLength=52
LineStart=44
LineColor=#ColorMain#,35
Solid=1
AntiAlias=1

[StyleRing]
Meter=Roundline
W=110
H=110
StartAngle=2.356
RotationAngle=4.712
LineLength=52
LineStart=44
LineColor=#ColorMain#
Solid=1
AntiAlias=1

[StyleValue]
Meter=String
W=110
FontFace=#FontLight#
FontSize=20
FontColor=#ColorText#
StringAlign=Center
Percentage=1
NumOfDecimals=0
AntiAlias=1

[StyleLabel]
Meter=String
FontFace=#FontMain#
FontSize=8
FontColor=#ColorDim#
StringStyle=Bold
StringAlign=Center
AntiAlias=1

; ---------- Meters ----------
[MeterBackground]
Meter=Shape
Shape=Rectangle 0,0,430,250,16 | Fill Color #ColorBg# | StrokeWidth 1 | Stroke Color #ColorMain#,110
Shape2=Rectangle 0,0,4,250,2 | Fill Color #ColorAlt# | StrokeWidth 0

[MeterTag]
Meter=String
X=26
Y=14
FontFace=#FontMain#
FontSize=9
FontColor=#ColorMain#
StringStyle=Bold
Text=A E T H E R   //   S Y S T E M
AntiAlias=1

; CPU
[CPURingBg]
MeterStyle=StyleRingBg
X=20
Y=42
[CPURing]
MeterStyle=StyleRing
MeasureName=MeasureCPU
X=20
Y=42
[CPUValue]
MeterStyle=StyleValue
MeasureName=MeasureCPU
X=75
Y=77
Text=%1
[CPULabel]
MeterStyle=StyleLabel
X=75
Y=150
Text=CPU

; RAM
[RAMRingBg]
MeterStyle=StyleRingBg
X=160
Y=42
[RAMRing]
MeterStyle=StyleRing
MeasureName=MeasureRAM
LineColor=#ColorAlt#
X=160
Y=42
[RAMValue]
MeterStyle=StyleValue
MeasureName=MeasureRAM
X=215
Y=77
Text=%1
[RAMLabel]
MeterStyle=StyleLabel
X=215
Y=150
Text=RAM

; DISCO
[DiskRingBg]
MeterStyle=StyleRingBg
X=300
Y=42
[DiskRing]
MeterStyle=StyleRing
MeasureName=MeasureDisk
X=300
Y=42
[DiskValue]
MeterStyle=StyleValue
MeasureName=MeasureDisk
X=355
Y=77
Text=%1
[DiskLabel]
MeterStyle=StyleLabel
X=355
Y=150
Text=DISCO C:

; REDE
[NetDown]
Meter=String
MeasureName=MeasureNetIn
X=28
Y=188
FontFace=#FontMain#
FontSize=10
FontColor=#ColorText#
AutoScale=1
NumOfDecimals=1
Text=DOWN  %1B/s
AntiAlias=1

[NetUp]
Meter=String
MeasureName=MeasureNetOut
X=210
Y=188
FontFace=#FontMain#
FontSize=10
FontColor=#ColorText#
AutoScale=1
NumOfDecimals=1
Text=UP  %1B/s
AntiAlias=1

[NetLine]
Meter=Shape
X=28
Y=216
Shape=Rectangle 0,0,374,1 | Fill Color #ColorMain#,60 | StrokeWidth 0
